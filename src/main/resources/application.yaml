spring:
  application:
    name: ai-queue-advisory-system

server:
  port: 8080

logging:
  level:
    root: INFO
    com.mihirjha.cloudai.queue: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

aws:
  region: ${AWS_REGION:us-east-1}
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME:ai-queue-advisory-images}      